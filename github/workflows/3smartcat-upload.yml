name: Upload XML to Smartcat

on:
  push:
    paths:
      - '**.xml'  # Watches for any XML file changes

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Verify XML file exists
        id: check_files
        run: |
          if [ ! -f *.xml ]; then
            echo "No XML files found"
            exit 1
          fi
          echo "xml_files=$(ls *.xml)" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Upload to Smartcat
        env:
          SMARTCAT_API_KEY: ${{ secrets.SMARTCAT_API_KEY }}
          SMARTCAT_PROJECT_ID: ${{ secrets.SMARTCAT_PROJECT_ID }}
        run: |
          python -c "
          import os
          import requests
          from glob import glob
          
          api_key = os.environ['SMARTCAT_API_KEY']
          project_id = os.environ['SMARTCAT_PROJECT_ID']
          
          for xml_file in glob('*.xml'):
              print(f'Uploading {xml_file}...')
              with open(xml_file, 'rb') as f:
                  response = requests.post(
                      'https://smartcat.ai/api/integration/v1/project/document',
                      headers={'Authorization': f'Bearer {api_key}'},
                      files={'file': f},
                      params={'projectId': project_id}
                  )
              if response.status_code != 200:
                  print(f'Error uploading {xml_file}: {response.text}')
                  raise SystemExit(1)
              print(f'Successfully uploaded {xml_file}')
          "
