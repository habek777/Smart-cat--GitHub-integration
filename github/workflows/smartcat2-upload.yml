<pre><code>name: Upload to Smartcat on: push: paths: - 'sample.xml' jobs: upload: runs-on: ubuntu-latest steps: - name: Checkout repo uses: actions/checkout@v3 - name: Set up Python uses: actions/setup-python@v4 with: python-version: '3.10' - name: Install requests run: pip install requests - name: Run upload script run: python smartcat_upload.py env: SMARTCAT_API_KEY: ${{ secrets.SMARTCAT_API_KEY }} SMARTCAT_PROJECT_ID: ${{ secrets.SMARTCAT_PROJECT_ID }} </code></pre>
